<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00A8E8">

<title>תשלום מהיר ב-Bit</title>

<style>

/* ===== הגדרות כלליות ===== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #e9f7ff, #ffffff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #243447;
}

/* ===== כרטיס ראשי ===== */

.container {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    padding: 32px 24px;
    border-radius: 26px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0, 70, 120, 0.10);
}

/* ===== לוגו ===== */

.logo {
    width: 95px;
    height: 95px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #e8f7ff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 44px;
    overflow: hidden;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== כותרות ===== */

h1 {
    font-size: 27px;
    margin: 0 0 10px;
    color: #142d4e;
}

.subtitle {
    font-size: 16px;
    color: #64748b;
    line-height: 1.7;
    margin-bottom: 26px;
}

/* ===== מספר הטלפון ===== */

.phone-box {
    background: #f1f9ff;
    border: 2px dashed #29a7e1;
    border-radius: 18px;
    padding: 22px 15px;
    margin-bottom: 24px;
}

.phone-label {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 10px;
}

.phone-number {
    font-size: 31px;
    font-weight: 800;
    color: #16365a;
    direction: ltr;
    letter-spacing: 1px;
}

/* ===== כפתורים ===== */

button {
    width: 100%;
    padding: 19px 12px;
    border: none;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:active {
    transform: scale(0.97);
}

/* כפתור העתקה */

.copy-btn {
    background: #00a8e8;
    color: white;
    box-shadow: 0 7px 20px rgba(0,168,232,0.28);
    margin-bottom: 13px;
}

/* כפתור פתיחה */

.bit-btn {
    background: #16365a;
    color: white;
    box-shadow: 0 7px 18px rgba(22,54,90,0.20);
}

/* הודעת העתקה */

.copy-success {
    color: #159447;
    font-size: 14px;
    font-weight: bold;
    margin-top: 12px;
    min-height: 20px;
}

/* ===== הוראות ===== */

.instructions {
    margin-top: 28px;
    padding: 22px 18px;
    border-radius: 18px;
    background: #f8fafc;
    text-align: right;
}

.instructions h3 {
    text-align: center;
    margin: 0 0 20px;
    font-size: 18px;
    color: #243447;
}

.step {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 17px;
    font-size: 14px;
    line-height: 1.6;
}

.step:last-child {
    margin-bottom: 0;
}

.step-number {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 50%;
    background: #00a8e8;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

/* ===== תחתית ===== */

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #94a3b8;
}

.small-note {
    font-size: 12px;
    color: #64748b;
    margin-top: 14px;
    line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

    <!-- ===== לוגו העסק ===== -->

    <div class="logo" id="businessLogo">
        💳
    </div>

    <!-- ===== שם העסק ===== -->

    <h1 id="businessName"></h1>

    <div class="subtitle">
        תשלום מהיר, פשוט ונוח באמצעות Bit 💙
    </div>

    <!-- ===== מספר הטלפון ===== -->

    <div class="phone-box">

        <div class="phone-label">
            מספר הטלפון להעברה ב-Bit
        </div>

        <div class="phone-number" id="phoneDisplay"></div>

    </div>

    <!-- ===== כפתור העתקה ===== -->

    <button class="copy-btn" id="copyButton" onclick="copyPhone()">
        📋 1. לחצו להעתקת מספר ה-Bit
    </button>

    <div class="copy-success" id="copyMessage" role="status" aria-live="polite"></div>

    <!-- ===== כפתור Bit ===== -->

    <button class="bit-btn" onclick="openBit()">
        📱 2. פתיחת Bit / התקנת האפליקציה
    </button>

    <div class="small-note">
        אם Bit כבר מותקנת בטלפון, ניתן לפתוח אותה גם ישירות ממסך הבית.
    </div>

    <!-- ===== הוראות ===== -->

    <div class="instructions">

        <h3>איך משלמים? 💙</h3>

        <div class="step">
            <div class="step-number">1</div>
            <span>לחצו על הכפתור להעתקת מספר הטלפון.</span>
        </div>

        <div class="step">
            <div class="step-number">2</div>
            <span>פתחו את אפליקציית Bit בטלפון.</span>
        </div>

        <div class="step">
            <div class="step-number">3</div>
            <span>בחרו בהעברת כסף, הדביקו את המספר והשלימו את התשלום.</span>
        </div>

    </div>

    <div class="footer">
        תודה שבחרתם לשלם אצלנו ❤️
    </div>

</div>

<script>

/* ========================================= */
/*           הגדרות העסק                     */
/* ========================================= */

// ✏️ כאן משנים את שם העסק
const BUSINESS_NAME = "שופן עיצוב שיער";

// ✏️ כאן משנים את מספר הטלפון
const BUSINESS_PHONE = "0537183809";

// ✏️ לוגו העסק (לא חובה)
// לדוגמה: "logo.png"
// השאירו ריק כדי להציג את האייקון הרגיל

const BUSINESS_LOGO = "";


/* ========================================= */
/*           קישורים ל-Bit                   */
/* ========================================= */

// קישור לאנדרואיד
const ANDROID_BIT_URL =
"https://play.google.com/store/apps/details?id=com.bnhp.payments.paymentsapp&gl=IL";

// קישור לאייפון
const IPHONE_BIT_URL =
"https://apps.apple.com/us/app/bit-%D7%91%D7%99%D7%98/id1182007739";


/* ========================================= */
/*           טעינת פרטי העסק                 */
/* ========================================= */

document.getElementById("businessName").textContent =
    BUSINESS_NAME;

document.getElementById("phoneDisplay").textContent =
    BUSINESS_PHONE;


// טעינת לוגו אם הוגדר

if (BUSINESS_LOGO !== "") {

    const logoContainer =
        document.getElementById("businessLogo");

    const logoImage = document.createElement("img");

    logoImage.src = BUSINESS_LOGO;
    logoImage.alt = "לוגו העסק";

    logoContainer.textContent = "";
    logoContainer.appendChild(logoImage);

}


/* ========================================= */
/*           העתקת מספר הטלפון               */
/* ========================================= */

async function copyPhone() {

    // הסרת מקפים ורווחים
    const phone = BUSINESS_PHONE.replace(/\D/g, "");

    let copied = false;

    // ניסיון העתקה מודרני
    if (navigator.clipboard && window.isSecureContext) {

        try {

            await navigator.clipboard.writeText(phone);

            copied = true;

        } catch (error) {

            console.log("Clipboard API failed", error);

        }

    }

    // שיטת גיבוי לדפדפנים ישנים
    if (!copied) {

        const textArea = document.createElement("textarea");

        textArea.value = phone;

        textArea.setAttribute("readonly", "");

        textArea.style.position = "fixed";
        textArea.style.left = "0";
        textArea.style.top = "0";
        textArea.style.opacity = "0";

        document.body.appendChild(textArea);

        textArea.focus();
        textArea.select();

        textArea.setSelectionRange(0, phone.length);

        try {

            copied = document.execCommand("copy");

        } catch (error) {

            copied = false;

        }

        document.body.removeChild(textArea);

    }

    const message =
        document.getElementById("copyMessage");

    const button =
        document.getElementById("copyButton");

    if (copied) {

        message.style.color = "#159447";

        message.textContent =
            "✓ המספר הועתק בהצלחה!";

        button.textContent =
            "✓ המספר הועתק!";

        setTimeout(() => {

            button.textContent =
                "📋 1. לחצו להעתקת מספר ה-Bit";

        }, 3000);

    } else {

        message.style.color = "#dc2626";

        message.textContent =
            "לא ניתן להעתיק אוטומטית. לחצו לחיצה ארוכה על המספר והעתיקו אותו.";

    }

}


/* ========================================= */
/*           פתיחת עמוד Bit                  */
/* ========================================= */

function openBit() {

    const userAgent = navigator.userAgent || "";

    // אייפון / אייפד
    if (/iPhone|iPad|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" &&
         navigator.maxTouchPoints > 1)) {

        window.location.href = IPHONE_BIT_URL;

    }

    // אנדרואיד
    else if (/Android/i.test(userAgent)) {

        window.location.href = ANDROID_BIT_URL;

    }

    // מחשבים ומכשירים אחרים
    else {

        window.location.href =
            "https://www.bitpay.co.il/";

    }

}

</script>

</body>
</html>
